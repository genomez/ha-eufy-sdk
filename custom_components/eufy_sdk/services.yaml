set_light_schedule:
  name: Set light schedule
  description: Replace the schedule entries of a supported HomeBase S1 floodlight. Other reported light settings are preserved.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: eufy_sdk
    entries:
      name: Schedule entries
      description: A complete list of vendor schedule entries. Use an empty list to clear the schedule. The sensor's entries attribute omits location, account, serial and other identity fields recursively. Copying it back can delete those fields on the device; it is not a lossless backup.
      required: true
      selector:
        object:
release_audit_hides:
  name: Release audit hides
  description: Admin only. Release integration-owned audit hides for a loaded config entry and prevent reapplication. User hides and disables are preserved.
  fields:
    entry_id:
      name: Config entry
      description: Loaded Eufy SDK config entry ID.
      required: true
      selector:
        config_entry:
          integration: eufy_sdk
